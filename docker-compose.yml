# M1: Postgres (docs + blobs), OctoBase keck (WS/HTTP), Venus web (nginx).
# keck image is AGPL-3.0 — see deploy/NOTICE. Web image is not AGPL.
# Do not publish 5432. Never omit DATABASE_URL (keck would fall back to SQLite).
# Never USE_MEMORY_SQLITE. Operators: docs/devops/compose.md

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: venus
      POSTGRES_PASSWORD: venus
      POSTGRES_DB: jwst
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venus -d jwst"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  octobase:
    build:
      context: ./deploy/octobase
      dockerfile: Dockerfile
      args:
        OCTOBASE_SHA: 276e0e94719a652483119c5fea16be13293ee21c
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://venus:venus@postgres:5432/jwst?sslmode=disable
      KECK_PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/3000'"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    depends_on:
      octobase:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  pg-data:
