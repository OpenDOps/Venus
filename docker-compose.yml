# M3.0: Postgres (Venus crdt_* + blobs), Venus hub (WS/HTTP), Venus web (nginx).
# Product Compose is postgres + hub + web. There is no octobase on this path.
# keck remains under deploy/octobase/ as M1 history; do not build it here.
# Hub image is MIT/Apache Venus code — see deploy/NOTICE.
# Never omit Postgres (no SQLite fallback). Do not publish 5432.
# Operators: docs/devops/compose.md  Component: docs/design/components/hub/

# Pool: 32 covers 10 distinct cold exports + 10 blob GETs + 10 room flushes
# overlapping, plus heartbeat. Compact shares the persist-task connection.
# Postgres image default max_connections is 100; two hubs (hub + hub-b) = 64.
x-hub-env: &hub-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: venus
  POSTGRES_PASSWORD: venus
  POSTGRES_DB: venus
  HUB_LISTEN: "0.0.0.0:3000"
  HUB_DB_MAX_CONNECTIONS: "32"
  HUB_DB_MIN_CONNECTIONS: "4"
  HUB_DB_ACQUIRE_TIMEOUT_SECS: "10"
  HUB_PERSIST_INTERVAL_MS: "1000"
  HUB_COMPACT_AFTER: "32"
  # Vite/Playwright talk to hub:3000. Empty string disables CORS (same-origin nginx).
  HUB_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080,http://127.0.0.1:8080"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: venus
      POSTGRES_PASSWORD: venus
      POSTGRES_DB: venus
    volumes:
      # New volume so M1 keck `jwst` rows on `pg-data` are not mistaken for hub tables.
      - pg-venus-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venus -d venus"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  hub:
    build:
      context: .
      dockerfile: deploy/hub/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *hub-env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/3000'"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Second process against the same Postgres. Prove workspace_lease refuses a second owner.
  #   docker compose --profile ha up --build hub-b
  hub-b:
    profiles: ["ha"]
    build:
      context: .
      dockerfile: deploy/hub/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *hub-env
      HUB_OWNER: hub-b
    ports:
      - "3001:3000"

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    depends_on:
      hub:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  pg-venus-data:
