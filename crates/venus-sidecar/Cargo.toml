[package]
name = "venus-sidecar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Venus snapshotter: y-octo hydrate + Path B convert (JS CLI oracle + Rust fromDoc)"
publish = false

[lib]
name = "venus_sidecar"
path = "src/lib.rs"

[[bin]]
name = "venus-sidecar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
y-octo = "0.1.0"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
