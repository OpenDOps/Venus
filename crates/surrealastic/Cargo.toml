[package]
name = "surrealastic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Surrealastic: replication, sharding, and clustering for SurrealDB. No Venus types."
publish = false

[features]
default = []
# Test-only fault injection and in-flight counters. Off in every non-test build.
fault = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
] }
surrealdb = { version = "2.7.0", default-features = false, features = [
  "protocol-ws",
  "rustls",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "live"
path = "tests/live.rs"
required-features = ["fault"]

[[test]]
name = "layout"
path = "tests/layout.rs"

[[test]]
name = "layout_live"
path = "tests/layout_live.rs"
