[package]
name = "venus-graph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Venus graph worker client: SurrealDB 2.x protocol only, no embedded RocksDB"
publish = false

[lib]
name = "venus_graph"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
] }
surrealdb = { version = "2.7.0", default-features = false, features = [
  "protocol-ws",
  "rustls",
] }
surrealastic = { path = "../surrealastic" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
